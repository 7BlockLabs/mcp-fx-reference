[project]
name = "fx-mcp"
version = "1.0.0"
description = "FX Rates MCP server — a 7Block Labs reference build for data/API companies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
fx-mcp = "fx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_mcp"]
